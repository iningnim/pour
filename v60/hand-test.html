<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>手冲太鼓 · 悬空手势测试</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Feasibility test: camera hand tracking → pour point + kettle tilt. Same arcade palette as the game. */
:root{
  --bg:#16100c; --panel:#211812; --panel2:#2a1f17; --line:#3d2e23;
  --fg:#f4e8da; --muted:#a8927d; --copper:#d98a4b; --ok:#5fe39a; --fast:#ffcf3d; --slow:#4fb3ff; --miss:#ff5d5d;
  --f-display:"ZCOOL QingKe HuangYou","PingFang SC",sans-serif;
  --f-num:"Chakra Petch","SF Mono",ui-monospace,monospace;
  --f-body:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px}
body{padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
h1{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;line-height:1}
h1 small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.06em}
#status{font-size:12px;color:var(--muted);text-align:right}
#status.ok{color:var(--ok)} #status.bad{color:var(--miss)}
.stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:1;max-width:100%}
#bed{width:100%;height:100%;display:block}
.cam{position:absolute;right:8px;top:8px;width:32%;aspect-ratio:4/3;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#000}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.hud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.hud div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.hud span{display:block;font-size:10px;color:var(--muted);letter-spacing:.06em}
.hud b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button.primary{background:var(--copper);border-color:var(--copper);color:#1a0f08;font-weight:700}
button[aria-pressed="true"]{border-color:var(--copper);background:#2f2117}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.seg{display:flex;gap:4px}
.seg button{padding:8px 10px;font-family:var(--f-num)}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
summary{cursor:pointer;color:var(--muted);font-size:13px}
.sl{display:grid;grid-template-columns:7em 1fr 3.5em;gap:8px;align-items:center;margin-top:8px;font-size:12px}
.sl output{font-family:var(--f-num);text-align:right}
.sl input{width:100%}
.tips{font-size:13px;color:var(--muted);line-height:1.7;margin:0}
.tips b{color:var(--fg)}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>悬空手势测试<small>手冲太鼓 · 摄像头控壶可行性</small></h1>
    <div id="status">未开始</div>
  </header>

  <div class="stage">
    <canvas id="bed"></canvas>
    <div class="cam"><video id="video" playsinline muted autoplay></video><canvas id="overlay"></canvas></div>
  </div>

  <div class="hud">
    <div><span>手腕角度</span><b id="hAng">--</b></div>
    <div><span>流速 g/s</span><b id="hFlow">0.0</b></div>
    <div><span>识别帧率</span><b id="hFps">--</b></div>
    <div><span>稳流率 · 近10秒</span><b id="hStable">--</b></div>
    <div><span>跟随误差 · 近10秒</span><b id="hAim">--</b></div>
    <div><span>识别抖动</span><b id="hJit">--</b></div>
  </div>

  <div class="row">
    <button class="primary" id="startBtn" type="button">开启摄像头</button>
    <button id="calBtn" type="button" disabled>校准</button>
    <span style="color:var(--muted);font-size:12px">目标</span>
    <div class="seg" id="targets">
      <button type="button" data-f="3">3</button><button type="button" data-f="5" aria-pressed="true">5</button><button type="button" data-f="8">8</button>
    </div>
    <button id="circleBtn" type="button" aria-pressed="true">光点绕圈</button>
  </div>

  <details>
    <summary>手感参数</summary>
    <div class="sl"><label for="sStart">出水角度</label><input id="sStart" type="range" min="0" max="40" value="12"><output id="oStart">12°</output></div>
    <div class="sl"><label for="sFull">满流角度</label><input id="sFull" type="range" min="30" max="100" value="65"><output id="oFull">65°</output></div>
    <div class="sl"><label for="sRange">移动范围</label><input id="sRange" type="range" min="8" max="35" value="18"><output id="oRange">18%</output></div>
    <div class="sl"><label for="sSmooth">平滑</label><input id="sSmooth" type="range" min="0" max="90" value="55"><output id="oSmooth">55</output></div>
  </details>

  <p class="tips">
    <b>怎么测：</b>手机立在桌上，前置摄像头对着你，人退到半臂远，光线亮一点。右手空握成拳，像握着壶柄，拳眼朝上。按“校准”时保持这个姿势不动。<br>
    <b>倒水：</b>像倒水一样把拳头往一侧转，转过出水角度就出水，转得越多流速越大。<br>
    <b>落点：</b>整只手平移，粉床上的水柱跟着走，跟住白色光点绕圈。<br>
    <b>要看的：</b>能不能稳在目标流速（稳流率越高越好），能不能跟住光点（误差越小越好），以及手举两分钟累不累。
  </p>
</div>

<script type="module">
const $=id=>document.getElementById(id);
const video=$('video'), overlay=$('overlay'), bed=$('bed'), statusEl=$('status');
const cfg={start:12, full:65, range:.18, smooth:.55};
const bind=(id,out,fn,fmt)=>{ const el=$(id); const u=()=>{ fn(+el.value); $(out).textContent=fmt(+el.value); }; el.addEventListener('input',u); u(); };
bind('sStart','oStart',v=>cfg.start=v,v=>v+'°');
bind('sFull','oFull',v=>cfg.full=v,v=>v+'°');
bind('sRange','oRange',v=>cfg.range=v/100,v=>v+'%');
bind('sSmooth','oSmooth',v=>cfg.smooth=v/100,v=>String(v));
let target=5, circling=true;
$('targets').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; target=+b.dataset.f;
  for(const x of $('targets').children) x.setAttribute('aria-pressed',x===b); });
$('circleBtn').onclick=()=>{ circling=!circling; $('circleBtn').setAttribute('aria-pressed',circling); };
function setStatus(t,cls){ statusEl.textContent=t; statusEl.className=cls||''; }

// ---------- state ----------
let landmarker=null, running=false, lastVideoTime=-1;
let hand=null;               // latest raw landmarks
let neutral=null;            // {ang, x, y}
let sAng=null, sX=null, sY=null; // smoothed values
let angle=0, aimX=0, aimY=0, flow=0, seen=false, lostAt=0;
let detTimes=[], jitter=[];
const hist=[]; // [t, flow, aimDist]
const dep=new Float32Array(64*64);

// ---------- hand tracking ----------
async function startCam(){
  $('startBtn').disabled=true; setStatus('加载识别模型…');
  try{
    const { FilesetResolver, HandLandmarker } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fs=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const opts=d=>({ baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate:d },
      runningMode:'VIDEO', numHands:1, minHandDetectionConfidence:.5, minTrackingConfidence:.5 });
    try{ landmarker=await HandLandmarker.createFromOptions(fs,opts('GPU')); }
    catch(e){ landmarker=await HandLandmarker.createFromOptions(fs,opts('CPU')); }
  }catch(e){ setStatus('模型加载失败，检查网络后刷新','bad'); $('startBtn').disabled=false; console.error(e); return; }
  setStatus('请求摄像头…');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    video.srcObject=stream; await video.play();
  }catch(e){ setStatus('摄像头打不开：需要 https 网址并允许访问','bad'); $('startBtn').disabled=false; return; }
  running=true; $('calBtn').disabled=false; $('startBtn').textContent='摄像头已开启';
  setStatus('举起右手，然后按校准');
}
$('startBtn').onclick=startCam;
$('calBtn').onclick=()=>{
  if(!hand){ setStatus('没看到手，先把手放进画面','bad'); return; }
  setStatus('保持握拳姿势别动…'); const samples=[]; const t0=performance.now();
  const iv=setInterval(()=>{ if(hand) samples.push(measure(hand));
    if(performance.now()-t0>900){ clearInterval(iv);
      if(samples.length<5){ setStatus('校准失败，手要一直在画面里','bad'); return; }
      const avg=k=>samples.reduce((a,s)=>a+s[k],0)/samples.length;
      neutral={ang:avg('ang'), x:avg('x'), y:avg('y')}; sAng=neutral.ang; sX=neutral.x; sY=neutral.y;
      dep.fill(0); hist.length=0; setStatus('已校准，转拳倒水','ok'); } },30);
};
// palm center and in-image rotation of the wrist→middle-knuckle line (mirrored so it matches what you see)
function measure(lm){
  const pts=[0,5,9,17].map(i=>lm[i]);
  const x=1-pts.reduce((a,p)=>a+p.x,0)/4, y=pts.reduce((a,p)=>a+p.y,0)/4;
  const dx=-(lm[9].x-lm[0].x), dy=lm[9].y-lm[0].y;
  return {x,y,ang:Math.atan2(dx,-dy)*180/Math.PI};
}
const wrap=a=>{ while(a>180)a-=360; while(a<-180)a+=360; return a; };
function track(){
  if(!running||video.readyState<2) return;
  if(video.currentTime===lastVideoTime) return;
  lastVideoTime=video.currentTime;
  const now=performance.now();
  const r=landmarker.detectForVideo(video,now);
  detTimes.push(now); while(detTimes.length&&now-detTimes[0]>1000) detTimes.shift();
  hand=r.landmarks&&r.landmarks[0]||null;
  drawOverlay();
  if(!hand){ if(seen){ seen=false; lostAt=now; } return; }
  seen=true;
  const m=measure(hand);
  if(!neutral){ neutral={ang:m.ang,x:m.x,y:m.y}; sAng=m.ang; sX=m.x; sY=m.y; setStatus('已自动校准，可随时按校准重设','ok'); }
  const k=1-cfg.smooth*.9;
  const prev=sAng;
  sAng+=wrap(m.ang-sAng)*k; sX+=(m.x-sX)*k; sY+=(m.y-sY)*k;
  jitter.push(Math.abs(wrap(sAng-prev))); if(jitter.length>30) jitter.shift();
  angle=Math.abs(wrap(sAng-neutral.ang));
  aimX=Math.max(-1.1,Math.min(1.1,(sX-neutral.x)/cfg.range));
  aimY=Math.max(-1.1,Math.min(1.1,(sY-neutral.y)/cfg.range));
}
function drawOverlay(){
  const W=overlay.width=overlay.clientWidth*devicePixelRatio, H=overlay.height=overlay.clientHeight*devicePixelRatio;
  const ctx=overlay.getContext('2d'); ctx.clearRect(0,0,W,H); if(!hand) return;
  // map normalized coords through object-fit:cover
  const vw=video.videoWidth||640, vh=video.videoHeight||480, sc=Math.max(W/vw,H/vh), ox=(W-vw*sc)/2, oy=(H-vh*sc)/2;
  const P=p=>[ox+p.x*vw*sc, oy+p.y*vh*sc];
  const bones=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
  ctx.strokeStyle='#d98a4b'; ctx.lineWidth=2*devicePixelRatio;
  for(const [a,b] of bones){ const [x1,y1]=P(hand[a]),[x2,y2]=P(hand[b]); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
  const [wx,wy]=P(hand[0]),[mx,my]=P(hand[9]); ctx.strokeStyle='#5fe39a'; ctx.lineWidth=4*devicePixelRatio; ctx.beginPath(); ctx.moveTo(wx,wy); ctx.lineTo(mx,my); ctx.stroke();
}

// ---------- simulation + drawing ----------
const ghostAt=t=>{ const a=t*2*Math.PI/2.6, q=(t/7)%1, r=.15+.5*(q<.5?q*2:2-q*2); return [r*Math.sin(a),-r*Math.cos(a)]; };
function deposit(ax,ay,amt){ const N=64, sig=.08, gx=(ax+1)/2*N-.5, gy=(ay+1)/2*N-.5, sc=sig*N/2, R=Math.ceil(sc*2.5);
  for(let j=Math.max(0,Math.floor(gy-R));j<=Math.min(N-1,Math.ceil(gy+R));j++) for(let i=Math.max(0,Math.floor(gx-R));i<=Math.min(N-1,Math.ceil(gx+R));i++){
    const x=(i+.5)/N*2-1, y=(j+.5)/N*2-1; if(x*x+y*y>1) continue; dep[j*N+i]+=amt*Math.exp(-((i-gx)**2+(j-gy)**2)/(2*sc*sc))*.06; } }
const off=document.createElement('canvas'); off.width=off.height=64; const octx=off.getContext('2d'); const img=octx.createImageData(64,64);
const noise=Float32Array.from({length:4096},()=>Math.random());
function drawBed(t){
  const r=bed.getBoundingClientRect(), d=devicePixelRatio; bed.width=r.width*d; bed.height=r.height*d;
  const ctx=bed.getContext('2d'); ctx.setTransform(d,0,0,d,0,0);
  const W=r.width, H=r.height, cx=W/2, cy=H/2+H*.04, R=Math.min(W,H)*.34;
  ctx.beginPath(); ctx.arc(cx,cy,R*1.12,0,7); ctx.fillStyle='#d9cdbb'; ctx.fill();
  const px=img.data; for(let k=0;k<4096;k++){ const i=k%64,j=(k/64)|0,x=(i+.5)/32-1,y=(j+.5)/32-1,o=k*4; if(x*x+y*y>1){px[o+3]=0;continue;}
    const w=Math.min(1,dep[k]), n=(noise[k]-.5)*26; px[o]=150+n-94*w; px[o+1]=106+n*.8-71*w; px[o+2]=70+n*.6-48*w; px[o+3]=255; }
  octx.putImageData(img,0,0);
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.clip(); ctx.drawImage(off,cx-R,cy-R,2*R,2*R); ctx.restore();
  ctx.beginPath(); ctx.arc(cx,cy,R*.9,0,7); ctx.setLineDash([2,5]); ctx.strokeStyle='rgba(255,93,93,.35)'; ctx.stroke(); ctx.setLineDash([]);
  // guide
  let g=null; if(circling){ g=ghostAt(t); const gx=cx+g[0]*R, gy=cy+g[1]*R;
    ctx.beginPath(); ctx.arc(gx,gy,R*.13,0,7); ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=2.5; ctx.stroke(); ctx.lineWidth=1;
    ctx.globalAlpha=.25; for(let k=1;k<=10;k++){ const g2=ghostAt(t+k*.15); ctx.beginPath(); ctx.arc(cx+g2[0]*R,cy+g2[1]*R,1.6,0,7); ctx.fillStyle='#fff'; ctx.fill(); } ctx.globalAlpha=1; }
  // LED ring: color = flow vs target
  const ok=Math.abs(flow-target)<=.6, col=flow<.3?'#a8927d':ok?'#5fe39a':flow>target?'#ffcf3d':'#4fb3ff';
  for(let i=0;i<24;i++){ const a=-Math.PI/2+i/24*Math.PI*2; ctx.globalAlpha=flow>.3?.9:.25; ctx.fillStyle=col; ctx.beginPath(); ctx.arc(cx+Math.cos(a)*R*1.27,cy+Math.sin(a)*R*1.27,Math.max(3,R*.05),0,7); ctx.fill(); }
  ctx.globalAlpha=1;
  // kettle above the pour point
  const ax=cx+aimX*R, ay=cy+aimY*R, tilt=Math.min(1,angle/Math.max(cfg.full,1)), k=R/150, ox=ax-R*.5, oy=ay-R*.42, rot=tilt*1.15;
  ctx.save(); ctx.translate(ox,oy); ctx.rotate(rot); ctx.scale(k,k); ctx.globalAlpha=seen?.92:.35;
  ctx.lineWidth=3/k; ctx.strokeStyle='#d98a4b'; ctx.fillStyle='#2a1f17';
  ctx.beginPath(); ctx.roundRect?ctx.roundRect(-28,-24,56,48,9):ctx.rect(-28,-24,56,48); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#d98a4b'; ctx.fillRect(-9,-33,18,9);
  ctx.lineCap='round'; ctx.lineWidth=5.4/k; ctx.beginPath(); ctx.moveTo(26,10); ctx.quadraticCurveTo(52,8,58,-26); ctx.stroke();
  ctx.lineWidth=3.6/k; ctx.beginPath(); ctx.moveTo(-28,-14); ctx.quadraticCurveTo(-50,-10,-46,14); ctx.quadraticCurveTo(-42,22,-28,14); ctx.stroke();
  ctx.restore(); ctx.globalAlpha=1; ctx.lineCap='butt';
  const lx=58*k, ly=-26*k, tx=ox+lx*Math.cos(rot)-ly*Math.sin(rot), ty=oy+lx*Math.sin(rot)+ly*Math.cos(rot);
  if(flow>.1){ ctx.strokeStyle='rgba(150,205,255,.8)'; ctx.lineWidth=1+flow*.4; ctx.beginPath(); ctx.moveTo(tx,ty); ctx.quadraticCurveTo(tx+(ax-tx)*.2,ty+(ay-ty)*.6,ax,ay); ctx.stroke(); ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(ax,ay,2+flow*.9,0,7); ctx.fillStyle='rgba(150,205,255,.85)'; ctx.fill(); }
  else { ctx.strokeStyle='rgba(150,205,255,.7)'; ctx.beginPath(); ctx.moveTo(ax-8,ay); ctx.lineTo(ax+8,ay); ctx.moveTo(ax,ay-8); ctx.lineTo(ax,ay+8); ctx.stroke(); }
  // flow meter on the left
  const mx=14, mt=H*.18, mh=H*.64; ctx.fillStyle='#2a1f17'; ctx.fillRect(mx,mt,8,mh);
  const yOf=f=>mt+mh*(1-f/10);
  ctx.fillStyle='rgba(95,227,154,.25)'; ctx.fillRect(mx-4,yOf(target+.6),16,yOf(target-.6)-yOf(target+.6));
  ctx.fillStyle=col; ctx.fillRect(mx,yOf(flow),8,mt+mh-yOf(flow));
  ctx.fillStyle='#a8927d'; ctx.font='10px "Chakra Petch",monospace'; for(const f of [3,5,8]) ctx.fillText(String(f),mx+12,yOf(f)+3);
  if(!seen&&running){ ctx.fillStyle='rgba(255,93,93,.9)'; ctx.font='13px -apple-system,"PingFang SC",sans-serif'; ctx.textAlign='center'; ctx.fillText('没看到手',cx,H-12); ctx.textAlign='left'; }
  return g;
}
let last=performance.now()/1000;
function loop(){
  const now=performance.now()/1000, dt=Math.min(.05,now-last); last=now;
  track();
  const tf=angle>cfg.start&&seen&&neutral?Math.min(10,(angle-cfg.start)/Math.max(1,cfg.full-cfg.start)*10):0;
  flow+=(tf-flow)*(1-Math.exp(-dt/(tf>flow?.15:.1))); if(flow<.03) flow=0;
  if(flow>0) deposit(aimX,aimY,flow*dt);
  for(let i=0;i<4096;i++) dep[i]*=Math.exp(-dt/40);
  const g=drawBed(now);
  if(flow>.3){ const ad=g?Math.hypot(aimX-g[0],aimY-g[1]):null; hist.push([now,flow,ad]); }
  while(hist.length&&now-hist[0][0]>10) hist.shift();
  $('hAng').textContent=neutral&&seen?Math.round(angle)+'°':'--';
  $('hFlow').textContent=flow.toFixed(1);
  $('hFps').textContent=running?String(detTimes.length):'--';
  if(hist.length>20){ const st=hist.filter(h=>Math.abs(h[1]-target)<=.6).length/hist.length; $('hStable').textContent=Math.round(st*100)+'%';
    const ads=hist.filter(h=>h[2]!==null); $('hAim').textContent=ads.length?(ads.reduce((a,h)=>a+h[2],0)/ads.length).toFixed(2):'--'; }
  else { $('hStable').textContent='--'; $('hAim').textContent='--'; }
  $('hJit').textContent=jitter.length?(jitter.reduce((a,b)=>a+b,0)/jitter.length).toFixed(1)+'°':'--';
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
